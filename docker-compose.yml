name: bamboo-moisture-recheck
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-bamboo-moisture-recheck}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bamboo}
      POSTGRES_USER: ${POSTGRES_USER:-bamboo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bamboo_dev_password}
    ports: ["${DB_PORT:-17774}:5432"]
    volumes: [bamboo_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bamboo} -d ${POSTGRES_DB:-bamboo}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-bamboo-moisture-recheck}-redis
    volumes: [bamboo_redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-bamboo-moisture-recheck}-backend
    env_file: .env
    ports: ["${BACKEND_PORT:-19274}:8000"]
    volumes: [bamboo_runtime:/shared]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    build: ./worker
    container_name: ${COMPOSE_PROJECT_NAME:-bamboo-moisture-recheck}-worker
    env_file: .env
    volumes: [bamboo_runtime:/shared]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p='/shared/worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<30 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 30
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-bamboo-moisture-recheck}-frontend
    ports: ["${FRONTEND_PORT:-18274}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  bamboo_db_data:
  bamboo_redis_data:
  bamboo_runtime:
